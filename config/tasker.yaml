tasks:
  - id: portfolio-lab-health
    label: Health
    command: make health
    schedule: "0,30 * * * *"
    # Batch JO HT1: align with Makefile timeout 120 (was 60 → false timeout under load)
    timeout_seconds: 120

  - id: portfolio-lab-data
    label: Data
    command: make data
    schedule: "5 * * * *"
    # G2 (2026-08-11): 300s cap was hit mid-flight under deploy-window load
    # (killed 00:10Z with log truncated at 00:08:17Z). Steady state ~145s;
    # 600s = 10min hard cap, well under the 60min schedule gap.
    timeout_seconds: 600

  - id: portfolio-lab-dashboard
    label: Dashboard
    command: make dashboard
    schedule: "15 * * * *"
    # G2 (2026-08-11): 180s cap produced recurring timeout false positives
    # (23:18Z/00:18Z; post-reboot completion ~125s, steady ~109s).
    # 420s = 7min hard cap, well under the 60min schedule gap.
    timeout_seconds: 420

  - id: portfolio-lab-eval
    label: Evaluator
    command: make eval
    schedule: "20 */2 * * *"
    timeout_seconds: 600

  - id: portfolio-lab-research
    label: Research
    command: make research
    schedule: "25 */2 * * *"
    timeout_seconds: 300

  - id: portfolio-lab-wiki-sync
    label: Wiki Sync
    command: make wiki-sync
    schedule: "35 */2 * * *"
    timeout_seconds: 120

  - id: portfolio-lab-overlay-signals
    label: Overlay Signals
    command: make overlay-signals
    schedule: "40 * * * *"
    timeout_seconds: 600

  - id: portfolio-lab-overlay-dashboard
    label: Overlay Dashboard
    command: make overlay-dashboard
    schedule: "45 * * * *"
    timeout_seconds: 120

  - id: portfolio-lab-attribution
    label: Attribution
    command: make attribution
    schedule: "47 * * * *"
    timeout_seconds: 300

  - id: portfolio-lab-unified-dashboard
    label: Unified Dashboard
    command: make unified-dashboard
    schedule: "50 * * * *"
    timeout_seconds: 120

  - id: portfolio-lab-position-sync
    label: Position Sync
    command: make sync
    schedule: "55 */2 * * *"
    timeout_seconds: 60

  - id: portfolio-lab-garch-risk
    label: GARCH Risk
    command: make garch-risk
    schedule: "57 * * * *"
    timeout_seconds: 120

  - id: portfolio-lab-daily-pnl
    label: Daily P&L
    command: make daily-pnl
    # G8 (2026-08-11): :40 collided with overlay-signals (:40 hourly) on the
    # single worker -> recurring busy-skip WARNINGs. Shifted to :41 (free slot;
    # overlay-dashboard :45 / attribution :47 / position-sync :55).
    schedule: "10,41 * * * *"
    timeout_seconds: 60

  - id: portfolio-lab-daily-brief
    label: Daily Brief
    command: make daily-brief
    # G8 (2026-08-11): :25 collided with research (:25 every even hour) on the
    # single worker -> busy-skip WARNINGs on even hours. Shifted to :26.
    schedule: "26 * * * *"
    timeout_seconds: 120

  - id: portfolio-lab-prune-logs
    label: Log Pruning
    command: make prune-logs
    schedule: "3 3 * * *"
    timeout_seconds: 120

  - id: portfolio-lab-prod-ideas
    label: Prod Ideas
    command: make prod-ideas
    schedule: "12 * * * *"
    timeout_seconds: 60

  - id: portfolio-lab-fetch-trends
    label: Google Trends Fetch
    command: make fetch-trends
    schedule: "20 4 * * 0"
    timeout_seconds: 300


  - id: portfolio-lab-build
    label: Build
    command: make build
    enabled: false
    manual_only: true
    timeout_seconds: 600

  - id: portfolio-lab-autonomous-agent
    label: Hermes Agent Audit Placeholder
    command: make help
    enabled: false
    manual_only: true
    timeout_seconds: 60
