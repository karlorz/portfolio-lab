# ─────────────────────────────────────────────────────────────
#  Portfolio-Lab — Docker Compose for production deployment
#
#  Services:
#    pipeline  — Cron-driven signal + dashboard pipeline
#    dashboard — Static file server for the built SPA
# ─────────────────────────────────────────────────────────────

services:
  # ── Signal pipeline (Python) ──────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-lab-pipeline
    restart: unless-stopped
    environment:
      - PORTFOLIO_LAB_ENABLE_ML=${PORTFOLIO_LAB_ENABLE_ML:-0}
      - CRON_BACKEND=crontab
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JSON_LOGS=${JSON_LOGS:-1}
    volumes:
      - pipeline-data:/app/data
      - pipeline-public:/app/public/data
      - pipeline-logs:/app/data/logs
    # Run cron daemon for scheduled pipeline execution
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update && apt-get install -y --no-install-recommends cron &&
        crontab /app/crontab &&
        echo "Starting cron daemon for portfolio-lab pipeline..." &&
        cron -f
    healthcheck:
      test: ["CMD", "python", "-c", "from src.dashboard.generator import DashboardGenerator; print('ok')"]
      interval: 5m
      timeout: 30s
      retries: 3

  # ── Dashboard (static SPA served by Caddy) ────────────────
  dashboard:
    image: caddy:2-alpine
    container_name: portfolio-lab-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    volumes:
      - pipeline-public:/srv/data:ro
      - ./dist:/srv/app:ro
      - caddy-data:/data
      - caddy-config:/config
    command: caddy file-server --root /srv/app --listen :80
    depends_on:
      pipeline:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 2m
      timeout: 10s
      retries: 3

volumes:
  pipeline-data:
    driver: local
  pipeline-public:
    driver: local
  pipeline-logs:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
