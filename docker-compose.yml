# ─────────────────────────────────────────────────────────────
#  Portfolio-Lab — Docker Compose for production deployment
#
#  Services:
#    pipeline  — Cron-driven signal + dashboard pipeline
#    dashboard — Caddy reverse-proxy + static SPA + API proxy
# ─────────────────────────────────────────────────────────────

services:
  # ── Signal pipeline (Python) ──────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-lab-pipeline
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      - PORTFOLIO_LAB_ENABLE_ML=${PORTFOLIO_LAB_ENABLE_ML:-0}
      - CRON_BACKEND=crontab
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JSON_LOGS=${JSON_LOGS:-1}
    volumes:
      - pipeline-data:/app/data
      - pipeline-public:/app/public/data
      - pipeline-logs:/app/data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time; f='data/signals/signals.json'; assert os.path.exists(f) and time.time()-os.path.getmtime(f)<14400, 'stale data'"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 60s

  # ── Dashboard (Caddy SPA + API proxy) ─────────────────────
  dashboard:
    image: caddy:2-alpine
    container_name: portfolio-lab-dashboard
    restart: unless-stopped
    init: true
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    volumes:
      - pipeline-public:/srv/data:ro
      - ./dist:/srv/app:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      pipeline:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 2m
      timeout: 10s
      retries: 3

volumes:
  pipeline-data:
    driver: local
  pipeline-public:
    driver: local
  pipeline-logs:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
