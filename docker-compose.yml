# ─────────────────────────────────────────────────────────────
#  Portfolio-Lab — Docker Compose for production deployment
#
#  Services:
#    pipeline  — Tasker-driven signal + dashboard pipeline
#    dashboard — Caddy reverse-proxy + static SPA + API proxy
# ─────────────────────────────────────────────────────────────

services:
  # ── Signal pipeline (Python) ──────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-lab-pipeline
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      - PORTFOLIO_LAB_ENABLE_ML=${PORTFOLIO_LAB_ENABLE_ML:-0}
      - CRON_BACKEND=tasker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JSON_LOGS=${JSON_LOGS:-1}
    volumes:
      - pipeline-data:/app/data
      - pipeline-public:/app/public/data
      - pipeline-logs:/app/data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/api/tasker/status', timeout=5)); assert data.get('backend') == 'tasker'"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 60s

  # ── Dashboard (Caddy SPA + API proxy) ─────────────────────
  dashboard:
    image: caddy:2-alpine
    container_name: portfolio-lab-dashboard
    restart: unless-stopped
    init: true
    ports:
      - "${DASHBOARD_HTTP_PORT:-8080}:80"
      - "${DASHBOARD_HTTPS_PORT:-8443}:443"
    environment:
      - PORTFOLIO_LAB_SITE_ADDRESS=${PORTFOLIO_LAB_SITE_ADDRESS:-:80}
      - PORTFOLIO_LAB_TASKER_UPSTREAM=pipeline:8000
      - PORTFOLIO_LAB_PUBLIC_ROOT=/srv
      - PORTFOLIO_LAB_WEB_ROOT=/srv/app
    volumes:
      - pipeline-public:/srv/data:ro
      - ./dist:/srv/app:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      pipeline:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 2m
      timeout: 10s
      retries: 3

volumes:
  pipeline-data:
    driver: local
  pipeline-public:
    driver: local
  pipeline-logs:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
